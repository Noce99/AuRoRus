[package]
name = "aurorus"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
csv = "1.4.0"
ctrlc = "3.5"
faer = "0.24.4"
fax = "0.3.0"
# PANOC, for the minimum-curvature race line - see `planning::min_curvature`.
optimization_engine = "0.12.0"
rand = "0.10.2"
# "rc" enables the Arc/Rc Serialize+Deserialize impls, which `topics::SelectedMap`
# needs to carry its raster as a shared `Arc<[u8]>` rather than an owned copy.
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tiny_http = "0.12.0"
# Decoding arbitrary TIFFs (any compression, including the CCITT Group 4 of
# map.tiff files not written by `environment::tiff`) for the web GUI's map
# import - see `sensors::web_gui::maps_api::decode_tiff`.
tiff = "0.11"
toml = "1.1.4"
voronoice = "0.2.0"

# Only to switch Nagle's algorithm off on the web UIs' listening socket - see
# `web::bind_http`. Already in the dependency tree via other crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true # Link-Time Optimization: better optimization between the crates instead of single crate optimization. Slower compile time.
codegen-units = 1 # This disable parallel compilation, LTO works better with just one codegen unit. Slower compile time.
opt-level = 3 # Most possible agressive optimization. Slower compile time.
