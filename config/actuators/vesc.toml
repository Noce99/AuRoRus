# Configuration for `aurorus::actuators::Vesc`, the real car's VESC motor
# controller - driving its motor and steering servo, and reading its IMU.
# Used by `web_gui` on a car (see CAR_NAME). How the car itself steers, its
# ERPM per meter/second, its IMU's axes and its battery's cells are its
# calibration, config/calibration/<car>.toml - this file is only how it's
# driven.

# The VESC's serial port (/etc/udev/rules.d/99-vesc.rules names it).
port = "/dev/sensors/vesc"
# How often the command is sent and the VESC read, in Hz.
rate_hz = 100.0
# How long the VESC may take to answer, in seconds (it takes about 0.5 ms).
reply_timeout_s = 0.05
# How long to wait before reconnecting after losing the VESC, in seconds.
reconnect_delay_s = 1.0
# Commands older than this, in seconds, count as stale: the car stops.
command_timeout_s = 0.25

# Speeds below this, in meters/second, brake instead (nonzero speeds above
# it are raised to the car's min_speed_mps).
stop_speed_mps = 0.05
# The current the motor brakes with, in amperes.
brake_current_a = 2.0

# Below this voltage per cell, the GUI warns to recharge: 3.5 V (a LiPo
# cell is 4.2 V full).
low_battery_cell_v = 3.5

# --- Limits ---------------------------------------------------------------
# What the car is driven within, published on vehicle_limits for the
# autonomous algorithms along with the car's largest steering angle (the
# smaller of its two sides). max_speed_mps is a hard cap on every command.
[limits]
# Fastest the steering angle can change, in radians/second.
max_steering_rate_rad_s = 4.0
# Fastest the car is driven, either way, in meters/second.
max_speed_mps = 1.0
# Largest acceleration and deceleration, in meters/second^2.
max_accel_mps2 = 4.0
max_decel_mps2 = 8.0
