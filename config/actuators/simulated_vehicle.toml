# Configuration for `aurorus::actuators::SimulatedVehicle`.
#
# `limits` applies to every vehicle model kind. Each `[<kind>]` table holds
# that kind's physical parameters, used by `default_model()` - RC-car-scale
# geometry and actuator limits for a small (roughly 1/10-scale) RC racecar,
# matching the kind of track `generate_map` produces. `dynamic_bicycle`'s
# mass/inertia/cornering-stiffness values are placeholder estimates for that
# same scale of vehicle, not measured - tune them once a real (or more
# carefully modeled) vehicle is available.

# How often SimulatedVehicle advances the model and republishes
# vehicle_status, and how often it checks vehicle_model_selection for a
# wanted model switch, in Hz.
tick_rate_hz = 100.0

[limits]
# Largest front-wheel steering angle the servo can hold, in either
# direction, in radians (0.4189 rad = 24 degrees).
max_steering_angle_rad = 0.4189
# Fastest the steering angle can change, in radians/second.
max_steering_rate_rad_s = 4.0
# Largest speed the vehicle can be commanded to, in either direction (i.e.
# this also bounds reverse), in meters/second.
max_speed_mps = 8.0
# Largest forward acceleration the motor can produce, in meters/second^2.
max_accel_mps2 = 4.0
# Largest deceleration (braking) the motor can produce, in meters/second^2.
max_decel_mps2 = 8.0

[bicycle]
lf_m = 0.16
lr_m = 0.16

[dynamic_bicycle]
mass_kg = 3.5
yaw_inertia_kgm2 = 0.06
lf_m = 0.16
lr_m = 0.16
cf_n_per_rad = 60.0
cr_n_per_rad = 60.0

[nonlinear_bicycle]
mass_kg = 3.5
yaw_inertia_kgm2 = 0.06
lf_m = 0.16
lr_m = 0.16
cg_height_m = 0.05
tire_mu = 1.1
pacejka_b = 2.5
pacejka_c = 1.3
front_drive_fraction = 0.5

[pacejka_bicycle]
mass_kg = 3.5
yaw_inertia_kgm2 = 0.06
lf_m = 0.16
lr_m = 0.16
cg_height_m = 0.05
front_b = 2.5
front_c = 1.3
front_d_mu = 1.1
front_e = -0.5
rear_b = 2.5
rear_c = 1.3
rear_d_mu = 1.1
rear_e = -0.5
combined_slip_b = 1.0
combined_slip_c = 1.0
front_drive_fraction = 0.5

[two_track]
mass_kg = 3.5
yaw_inertia_kgm2 = 0.06
lf_m = 0.16
lr_m = 0.16
cg_height_m = 0.05
track_width_m = 0.2
front_b = 2.5
front_c = 1.3
front_d_mu = 1.1
front_e = -0.5
rear_b = 2.5
rear_c = 1.3
rear_d_mu = 1.1
rear_e = -0.5
combined_slip_b = 1.0
combined_slip_c = 1.0
front_drive_fraction = 0.5
