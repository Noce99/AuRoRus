# Configuration for `aurorus::autonomous_control::mpc`, ported from
# ubm's MPC path follower (`mpc_path_follower_node` + `mpc_casadi`):
# follows the selected map's race line with a model predictive controller
# over a kinematic bicycle, solved with PANOC. Defaults from ubm's
# `ego_mpc_path_follower` parameters.

# Rate at which a new control is published, in Hz. The MPC is only solved
# again when the vehicle has moved along its prediction - see
# `percentage_of_mpc_prediction_to_follow`.
rate_hz = 50.0
# Where the vehicle's pose and speed come from: 0 = localization (odometry
# composed onto SLAM's map_to_odom, only while localizing), 1 = ground truth
# (vehicle_status, simulation only).
pose_source = 0
# (The wheelbase is the vehicle's - its vehicle_geometry, from the car's
# calibration.)

# Steps in the prediction, the vehicle's own pose included (at least 4).
horizon = 15
# Arc length of one prediction step, in meters (ubm: 2 race line points).
step_m = 0.2
# [0, 100] How far into the horizon, in percent, the vehicle must be along
# the previous prediction before the MPC is solved again from it.
percentage_of_mpc_prediction_to_follow = 2.0

# Cost of 1 m average distance of the prediction from the race line.
distance_weight = 1.5
# Cost of the steering's second difference (steering smoothness).
steering_smoothness_weight = 60.0
# Cost of the deviation from the race line's speed.
go_fast_weight = 0.2
# Cost of the speed's second difference (acceleration smoothness).
speed_smoothness_weight = 1.0
# Cost of the centripetal acceleration (heading change times speed).
centripetal_weight = 0.0

# The speed stays between these times the race line's speed.
min_speed_gain = 0.5
max_speed_gain = 3.0
# Multiplies the race line's speed profile, pure number.
scale_speed = 1.0
# Farther than this from the race line, the vehicle stops, in meters.
max_cross_track_m = 1.0

# PANOC's tolerance on its fixed-point residual.
solver_tolerance = 1e-4
# Most PANOC iterations per solve.
solver_max_iterations = 300
# Longest a solve may take, in milliseconds.
solver_max_ms = 15.0

# WALLS - always on (ubm's only with an opponent).
# Cost of each predicted position's squared depth into walls_margin_m.
walls_cost_weight = 10.0
# Closer than this to a wall costs, in meters.
walls_margin_m = 0.3

# OPPONENT - the one UbmDetector publishes (the closest, with its
# `selection` at 1), for the ego vehicle only.
# Cost of the prediction's closeness to the opponent, predicted at constant
# velocity to when the vehicle gets there.
opponent_distance_weight = 30.0
# How far the opponent cost reaches, in meters (Gaussian only).
opponent_radius_m = 1.0
# Opponent cost: 1 = exp(-4 distance / radius), 0 = 1 / distance^2.
use_gaussian = 1
# How long after its last detection the detector's (Kalman) prediction of the
# opponent is still used, in seconds - the detector misses it in some scans.
# ubm dropped it at the first miss.
opponent_timeout_s = 0.5
