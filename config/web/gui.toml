# Configuration for `aurorus::web::gui::WebGui`, the local web UI for
# browsing/generating maps, driving the vehicle, and picking the vehicle
# physics model.

# Address WebGui binds its HTTP server to.
bind_addr = "0.0.0.0:1999"
# Number of worker threads handling requests concurrently - so a slow
# request (e.g. generating a large map) doesn't stall every other client.
worker_threads = 4
# How long each worker blocks waiting for a request before re-checking
# whether it should stop, in milliseconds - bounds shutdown latency without
# busy-waiting.
poll_interval_ms = 200
# Speed, in m/s, that a full W or S key press commands under WASD human
# control.
human_max_speed_mps = 8.0
# Steering angle, in radians, that a full A or D key press commands under
# WASD human control.
human_max_steering_rad = 0.35
# A race's starting grid: added to half a body length between one slot and
# the next along the centerline, in meters - two slots on the same side end
# up a body length plus twice this apart.
grid_gap_m = 0.2
# A race's starting grid: between each vehicle's side and the centerline, in
# meters.
grid_margin_m = 0.1
# How long a race's countdown (3, 2, 1, Go!) lasts before the vehicles are
# released, in milliseconds.
race_countdown_ms = 3000
# Benchmark panel: how many laps one benchmark run drives.
benchmark_laps = 10
# Benchmark panel: how often the vehicle's pose, speed and commands are
# written to a run's trajectory.csv, in Hz.
benchmark_sample_rate_hz = 40.0
# Benchmark panel: a lap that takes longer than the map's centerline driven
# at this speed, in m/s, ends the run as a timeout.
benchmark_timeout_speed_mps = 1.0
