# Configuration for `aurorus::planning::Planner`, which plans a
# minimum-curvature race line for the selected map, with a speed profile -
# see documentation/planning.md. Every value but `poll_interval_ms` and
# `solver_tolerance` can be tuned live from web_gui's Planning panel, and
# saved back here from it.

# How often the planner checks for a new request or parameter change, in
# milliseconds.
poll_interval_ms = 50

# --- Geometry ---------------------------------------------------------------

# Distance between the race line's points, in meters.
spacing_m = 0.1
# Points averaged (a moving average) to smooth a centerline computed from the
# walls, for maps that have none. 1 means no smoothing.
centerline_smoothing_window = 5

# --- Minimum-curvature optimization -----------------------------------------

# Extra distance kept from either wall, in meters, on top of half the
# vehicle's width (its vehicle_geometry) - 0.25 m in all on a 0.25 m wide
# car.
safety_margin_m = 0.125
# Share of the vehicle's steering lock (the smaller of its two sides, from
# its calibration) the race line may use: nowhere does it turn tighter than
# tan(max_steering_fraction * lock) / wheelbase, so the controller following
# it keeps the rest to correct with. Planning fails if the track can't be
# driven within that.
max_steering_fraction = 0.8
# Penalty on neighboring points' sideways offsets differing, in 1/m^4. 0 is
# pure minimum curvature.
smoothness_weight = 0.0
# Farthest any point may move in one iteration, in meters. Each iteration
# optimizes a linearization of the curvature, only accurate for small moves.
max_step_m = 0.3
# Most times the optimization is solved again around its latest solution.
iterations = 30
# Stops once no point moved further than this in an iteration, in meters.
tolerance_m = 0.005
# PANOC's tolerance on its fixed-point residual.
solver_tolerance = 1e-6
# Most PANOC iterations per solve. The problem is stiff (its curvature terms
# couple neighbors through second differences), so PANOC typically needs
# thousands; planning fails rather than use an unconverged solution.
solver_max_iterations = 100000

# --- Speed profile ----------------------------------------------------------

# Top speed, in m/s.
max_speed_mps = 8.0
# The vehicle's grip is a friction ellipse: braking or accelerating in a
# corner leaves less grip to turn. Its lateral semi-axis is the largest
# cornering acceleration, its longitudinal one the largest braking
# deceleration, and accelerating is further capped by the motor.
# Largest cornering (lateral) acceleration, in m/s^2.
max_lateral_accel_mps2 = 6.0
# Largest forward acceleration the motor gives, in m/s^2.
max_accel_mps2 = 4.0
# Largest braking deceleration, in m/s^2.
max_decel_mps2 = 6.0

# --- Minimum time -------------------------------------------------------------

# Distance between the minimum-time optimization's points, in meters - and
# between race_line_min_time.csv's points (resampling a polyline linearly
# would put kinks in it). 0.1 gives about the same lap time as 0.2 but takes
# over twice as long.
min_time_spacing_m = 0.2
# The line's sideways offsets follow a smooth curve (a B-spline) through
# control points this far apart, in meters. Smaller follows narrow sections
# closer but makes the problem stiffer and slower to solve.
min_time_control_spacing_m = 1.0
# Lowest speed allowed anywhere, in m/s.
min_speed_mps = 0.5
# Most outer (augmented Lagrangian) iterations.
min_time_max_outer_iterations = 30
# Time budget, in seconds. Minimum curvature is still saved if it runs out.
min_time_max_duration_s = 120.0
# Converged once no limit (ellipse, motor) is exceeded by more than this
# fraction of it. The saved speeds are recomputed to respect them exactly.
min_time_tolerance = 0.01
