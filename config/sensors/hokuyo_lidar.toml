# Configuration for `aurorus::sensors::HokuyoLidar`, the real car's Hokuyo
# UTM-30LX-EW, streamed over Ethernet (SCIP 2.0). Used by `web_gui` on a
# car (see CAR_NAME). The sensor's rate (40 Hz) and step layout (0.25
# degrees) come from the sensor itself.

# The sensor's host:port (factory default: 192.168.0.10:10940).
address = "192.168.0.10:10940"
# How long to wait for the sensor to accept a connection, in seconds.
connect_timeout_s = 1.0
# How long the sensor may go without sending a whole reply before the
# connection counts as lost, in seconds.
data_timeout_s = 0.5
# How long to wait before reconnecting after losing the sensor, in seconds.
reconnect_delay_s = 1.0

# Field of view to publish, centered on the sensor's front, in radians;
# capped to the sensor's own 270 degrees (4.71238898038469).
fov_rad = 4.71238898038469
# How many neighboring 0.25-degree steps each reading groups, the sensor
# reporting the closest of them. Odd; 1 keeps all 1081 readings, 3 gives
# 359 at 0.75 degrees.
cluster = 1
# Readings at or below min_distance_m, or at or beyond max_distance_m, in
# meters, are published as "nothing hit" (max_distance_m, no intensity) -
# as are the sensor's own error codes. UTM-30LX-EW: 0.1 to 30.
min_distance_m = 0.1
max_distance_m = 30.0

# Whether it is mounted upside down, and where on the car, is the car's
# calibration: config/calibration/<car>.toml's [lidar].
