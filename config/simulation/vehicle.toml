# Configuration for `aurorus::simulation::SimulatedVehicle`.
#
# `limits` applies to every vehicle model kind. Each `[<kind>]` table holds
# that kind's physical parameters, used by `default_model()`. The simulated
# car itself - its mass, axle distances (lf_m, lr_m), track width, size and
# largest steering angle - is a car's calibration, not this file: the car
# CAR_NAME (or --car) names, else config/car_template.toml (see
# SimulatedVehicleConfig::for_car). The inertia, cornering stiffness and tire
# values here are placeholder estimates for a roughly 1/10-scale RC car, not
# measured.

# How often SimulatedVehicle advances the model and republishes
# vehicle_status, and how often it checks vehicle_model_selection for a
# wanted model switch, in Hz.
tick_rate_hz = 100.0

[limits]
# (The largest steering angle is the simulated car's - see above.)
# Fastest the steering angle can change, in radians/second.
max_steering_rate_rad_s = 4.0
# Largest speed the vehicle can be commanded to, in either direction (i.e.
# this also bounds reverse), in meters/second.
max_speed_mps = 4.0
# Largest forward acceleration the motor can produce, in meters/second^2.
max_accel_mps2 = 4.0
# Largest deceleration (braking) the motor can produce, in meters/second^2.
max_decel_mps2 = 8.0

[bicycle]
# Nothing but the car's own geometry.

[dynamic_bicycle]
yaw_inertia_kgm2 = 0.06
cf_n_per_rad = 60.0
cr_n_per_rad = 60.0

[nonlinear_bicycle]
yaw_inertia_kgm2 = 0.06
cg_height_m = 0.05
tire_mu = 1.1
pacejka_b = 2.5
pacejka_c = 1.3
front_drive_fraction = 0.5

[pacejka_bicycle]
yaw_inertia_kgm2 = 0.06
cg_height_m = 0.05
front_b = 2.5
front_c = 1.3
front_d_mu = 1.1
front_e = -0.5
rear_b = 2.5
rear_c = 1.3
rear_d_mu = 1.1
rear_e = -0.5
combined_slip_b = 1.0
combined_slip_c = 1.0
front_drive_fraction = 0.5

[two_track]
yaw_inertia_kgm2 = 0.06
cg_height_m = 0.05
front_b = 2.5
front_c = 1.3
front_d_mu = 1.1
front_e = -0.5
rear_b = 2.5
rear_c = 1.3
rear_d_mu = 1.1
rear_e = -0.5
combined_slip_b = 1.0
combined_slip_c = 1.0
front_drive_fraction = 0.5
