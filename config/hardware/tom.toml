# The hardware calibration of the car "tom" - see src/hardware.rs for what
# each value means. Older ones are in config/hardware/history/tom/
# (gitignored). Positive y and angles are the car's right everywhere.
#
# Migrated by hand from config/actuators/vesc.toml and
# config/sensors/hokuyo_lidar.toml, before car_calibration existed: values
# marked "placeholder" were never measured on this car.

schema_version = 1
name = "tom"
calibrated_at = "2026-09-30 00:00:00"

[geometry]
# Measured with a tape.
wheelbase_m = 0.325
# Placeholder (the simulator's lr_m) - weigh each axle to measure it.
rear_axle_to_cg_m = 0.16
# Placeholder (the simulator's two_track value).
track_width_m = 0.2
# Placeholders (the size the GUI has always drawn).
body_length_m = 0.45
body_width_m = 0.25
# Placeholder (the simulator's value).
mass_kg = 3.5

[steering]
# Servo position -> steering angle, measured on the bench, wheels off the
# ground: straight at 0.50, ends 0.17/0.83 (end stops near 0.15/0.85) at
# about 27.2 degrees. A floor test at full left lock gave only ~0.31 rad
# effective - to be re-measured with car_calibration's circles.
points = [
    { servo = 0.17, angle_rad = -0.475 },
    { servo = 0.50, angle_rad = 0.0 },
    { servo = 0.83, angle_rad = 0.475 },
]

[motor]
# 366 electrical turns for 16 turns of a 9 cm wheel (positive ERPM = forward).
speed_to_erpm_gain = 4854.0
# The VESC's speed controller settles about 15% short (2500 -> ~2150 ERPM).
speed_compensation = 1.16
# The motor stalls at 1000 ERPM but holds ~2150 (0.44 m/s) smoothly.
min_speed_mps = 0.45

[battery]
cells = 4

[imu]
# The VESC is mounted rotated 90 degrees: its x points to the car's left,
# its y backwards, its z up - measured by tilting it.
x = "-y"
y = "-x"
z = "-z"

[lidar]
# The Hokuyo sends its right-most reading first as mounted.
upside_down = true
# Placeholder: at the center of gravity, as always assumed so far.
x_from_rear_axle_m = 0.16
y_m = 0.0
